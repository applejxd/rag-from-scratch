repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      - id: marimo-check
        name: marimo check
        entry: uv run marimo check --strict
        language: system
        files: ^rag_from_scratch_.*\.py$
        types: [python]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
